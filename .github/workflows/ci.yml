name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

  build-cross-platform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: arm64
          - target: x86_64-apple-darwin
            os: darwin
            arch: amd64
          - target: aarch64-apple-darwin
            os: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cross-compilation dependencies (Linux targets)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-x86-64-linux-gnu
          elif [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Set output filename
        id: set_output
        run: |
          output="quickxorhash-rust-${{ matrix.os }}-${{ matrix.arch }}"
          echo "filename=$output" >> $GITHUB_OUTPUT

      - name: Copy binary
        run: |
          cp target/${{ matrix.target }}/release/quickxorhash-rust ${{ steps.set_output.outputs.filename }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickxorhash-rust-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.set_output.outputs.filename }}
